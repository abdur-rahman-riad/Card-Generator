<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gen-Z Gamers – Player Card Generator</title>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e1a">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/tf.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img src="assets/logo.png" alt="" style="width:38px;height:38px;object-fit:contain;border-radius:8px"></div>
    <div><h1>GEN-Z GAMERS</h1><p>ONE CLUB, ONE DREAM</p></div>
  </div>
</header>
<main>
  <section id="create" class="panel">
    <div class="drop" id="drop">
      <div id="ph"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></div><b>Tap to upload photo</b><small>JPG, PNG up to 5MB</small></div>
      
    </div>
    <input type="file" id="file" accept="image/png,image/jpeg" hidden>
    <div id="editor" hidden>
      <canvas id="ed" width="632" height="624"></canvas>
      <p class="hint" style="margin:10px 0 0">Drag the photo to reposition. Pinch or use the slider to zoom.</p>
      <label class="chk"><input type="checkbox" id="usebg"> Change background to winter theme</label>
      <p class="hint" id="bgst" style="margin:6px 0 0;text-align:left"></p>
      <div class="ctl"><button class="sm" id="zo" aria-label="Zoom out">−</button><input type="range" id="zm" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><button class="sm" id="zi" aria-label="Zoom in">+</button></div>
      <div class="pad"><button class="sm" id="mu" aria-label="Move up">↑ Up</button><button class="sm" id="md" aria-label="Move down">↓ Down</button><button class="sm" id="ml" aria-label="Move left">← Left</button><button class="sm" id="mr" aria-label="Move right">→ Right</button></div>
      <div class="row"><button class="btn alt" id="rst" style="height:48px;font-size:15px">Reset</button><button class="btn alt" id="chg" style="height:48px;font-size:15px">Change photo</button></div>
    </div>
    <label for="name">Player Name</label>
    <div class="in"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="name" maxlength="24" placeholder="e.g. FrostKing_99" autocomplete="off"></div>
    <label for="device">Device Name</label>
    <div class="in"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/></svg><input id="device" maxlength="28" placeholder="e.g. iPhone 15 Pro Max" autocomplete="off"></div>
    <label for="eid">eFootball ID</label>
    <div class="in"><svg viewBox="0 0 24 24"><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/><rect x="2" y="6" width="20" height="12" rx="5"/></svg><input id="eid" maxlength="20" inputmode="text" placeholder="e.g. Bg12367f" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="err" id="err"></div>
    <button class="go" id="gen"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Generate Player Card</button>
  </section>

  <section id="result" class="panel res">
    <img id="out" alt="Your player card">
    <button class="btn" id="save" style="margin-top:16px">Download Card</button>
    <p class="hint" id="dlmsg"></p>
    <div class="row"><button class="btn alt" id="share" hidden>Share</button><button class="btn alt" id="again">Create Another</button></div>
  </section>
</main>
<canvas id="cv" width="1122" height="1402" hidden></canvas>
<script src="js/app.js"></script>
</body>
</html>
